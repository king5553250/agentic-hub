# OMNI-BRAIN TASK DISPATCHER
# Handles specific user commands sent via webhook or manual trigger.
# Use: curl -X POST https://api.github.com/repos/king5553250/agentic-hub/dispatches
#   -H "Authorization: Bearer $GITHUB_TOKEN"
#   -d '{"event_type":"omni-brain-task","client_payload":{"task":"fetch_emails","params":{}}}'

name: Task Dispatcher

on:
  repository_dispatch:
    types: [omni-brain-task]
  workflow_dispatch:
    inputs:
      app:
        description: 'Target app (gmail, github, calendar, discord, canvas, youtube)'
        required: true
      action:
        description: 'Action to perform'
        required: true
      params:
        description: 'JSON params'
        required: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Parse Task
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TASK=${{ github.event.client_payload.task }}" >> $GITHUB_OUTPUT
            echo "APP=${{ github.event.client_payload.app }}" >> $GITHUB_OUTPUT
            echo "ACTION=${{ github.event.client_payload.action }}" >> $GITHUB_OUTPUT
          else
            echo "TASK=manual" >> $GITHUB_OUTPUT
            echo "APP=${{ inputs.app }}" >> $GITHUB_OUTPUT
            echo "ACTION=${{ inputs.action }}" >> $GITHUB_OUTPUT
          fi

      - name: Route to Albato Bridge
        run: |
          echo "[TASK ROUTER] Routing ${{ steps.parse.outputs.APP }}.${{ steps.parse.outputs.ACTION }}"
          curl -s -X POST https://h.albato.com/wh/38/1lf3rnr/O9whZJUQfZcWAqkAiodlBeMR9qkbL21l1yZSAYPqr78/ \
            -H "Content-Type: application/json" \
            -d '{
              "source": "github-actions",
              "app": "${{ steps.parse.outputs.APP }}",
              "action": "${{ steps.parse.outputs.ACTION }}",
              "params": ${{ inputs.params || '{}' }},
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }' || true

      - name: Notify Discord
        if: always()
        run: |
          echo "[ENVOY] Task ${{ steps.parse.outputs.APP }}.${{ steps.parse.outputs.ACTION }} completed."
