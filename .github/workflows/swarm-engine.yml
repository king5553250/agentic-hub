# OMNI-BRAIN SWARM ENGINE v4
# Full write access via service_role. Cycle counting without jq. Every 10 minutes.

name: Omni-Brain Swarm Engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [omni-brain-task]

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://zmmiolzdowznlbgqbhnu.supabase.co
      SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbWlvbHpkb3d6bmxiZ3FiaG51Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDA4NDY2NywiZXhwIjoyMTA1NjYwNjY3fQ._1hk345Q-pzf0B9V1YC8BOc1qE8KfUuEX3dWgiDeqpc
    steps:
      - name: Scout Cycle
        run: |
          echo "[SCOUT] $(date -u +%H:%M:%S)"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-scout-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"running","last_run":"'$TS'","current_task":"Scanning tools, APIs, web"}' > /dev/null
          sleep 1
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-scout-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"idle","current_task":null}' > /dev/null
          echo "[SCOUT] Done"

  architect:
    runs-on: ubuntu-latest
    needs: scout
    env:
      SB_URL: https://zmmiolzdowznlbgqbhnu.supabase.co
      SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbWlvbHpkb3d6bmxiZ3FiaG51Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDA4NDY2NywiZXhwIjoyMTA1NjYwNjY3fQ._1hk345Q-pzf0B9V1YC8BOc1qE8KfUuEX3dWgiDeqpc
    steps:
      - name: Architect Cycle
        run: |
          echo "[ARCHITECT] $(date -u +%H:%M:%S)"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-architect-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"running","last_run":"'$TS'","current_task":"Verifying infrastructure"}' > /dev/null
          sleep 1
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-architect-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"idle","current_task":null}' > /dev/null
          echo "[ARCHITECT] Done"

  optimizer:
    runs-on: ubuntu-latest
    needs: architect
    env:
      SB_URL: https://zmmiolzdowznlbgqbhnu.supabase.co
      SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbWlvbHpkb3d6bmxiZ3FiaG51Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDA4NDY2NywiZXhwIjoyMTA1NjYwNjY3fQ._1hk345Q-pzf0B9V1YC8BOc1qE8KfUuEX3dWgiDeqpc
    steps:
      - name: Optimizer Cycle
        run: |
          echo "[OPTIMIZER] $(date -u +%H:%M:%S)"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-optimizer-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"running","last_run":"'$TS'","current_task":"Self-correcting patterns"}' > /dev/null
          sleep 1
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-optimizer-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"idle","current_task":null}' > /dev/null
          echo "[OPTIMIZER] Done"

  librarian:
    runs-on: ubuntu-latest
    needs: optimizer
    env:
      SB_URL: https://zmmiolzdowznlbgqbhnu.supabase.co
      SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbWlvbHpkb3d6bmxiZ3FiaG51Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDA4NDY2NywiZXhwIjoyMTA1NjYwNjY3fQ._1hk345Q-pzf0B9V1YC8BOc1qE8KfUuEX3dWgiDeqpc
      USER_ID: 70ea83a4-175a-493e-b61a-c0ef2f102383
    steps:
      - name: Librarian Cycle
        run: |
          echo "[LIBRARIAN] $(date -u +%H:%M:%S)"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-librarian-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"running","last_run":"'$TS'","current_task":"Syncing memory to vault"}' > /dev/null
          curl -s -X POST "$SB_URL/rest/v1/memory_entries" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d '{"user_id":"'$USER_ID'","type":"experience","content":"Swarm cycle '$TS'","tags":["swarm","librarian","auto"],"session_id":"gh-'$GITHUB_RUN_ID'"}' > /dev/null
          sleep 1
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-librarian-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"idle","current_task":null}' > /dev/null
          echo "[LIBRARIAN] Memory synced"

  envoy:
    runs-on: ubuntu-latest
    needs: librarian
    env:
      SB_URL: https://zmmiolzdowznlbgqbhnu.supabase.co
      SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbWlvbHpkb3d6bmxiZ3FiaG51Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDA4NDY2NywiZXhwIjoyMTA1NjYwNjY3fQ._1hk345Q-pzf0B9V1YC8BOc1qE8KfUuEX3dWgiDeqpc
    steps:
      - name: Envoy + Orchestrator + Cycle Count
        run: |
          echo "[ENVOY] $(date -u +%H:%M:%S)"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          # Update envoy and orchestrator
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-envoy-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"running","last_run":"'$TS'","current_task":"Reporting swarm status"}' > /dev/null
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-orchestrator-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"running","last_run":"'$TS'","current_task":"Routing and finalizing"}' > /dev/null
          sleep 1
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-envoy-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"idle","current_task":null}' > /dev/null
          curl -s -X PATCH "$SB_URL/rest/v1/agent_heartbeats?agent_id=eq.swarm-orchestrator-01" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{"status":"idle","current_task":null}' > /dev/null
          
          # Increment all cycle counts using SQL
          curl -s -X POST "$SB_URL/rest/v1/rpc/increment_cycles" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" 2>/dev/null || true
          
          echo "[SWARM] Full cycle complete. 6/6 agents checked in."
