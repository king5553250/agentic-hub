# OMNI-BRAIN DEAD SWITCH
# Dumps entire session state to vault when triggered. Non-negotiable.
# Trigger via: curl -X POST https://api.github.com/repos/king5553250/agentic-hub/dispatches
#   -d '{"event_type":"dead-switch"}'

name: Dead Switch Protocol

on:
  repository_dispatch:
    types: [dead-switch]
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dead Switch — Full Dump
        run: |
          echo "[DEAD SWITCH] Executing full state dump..."
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Run ID: ${{ github.run_id }}"
          echo "Trigger: ${{ github.event_name }}"
          
          # Relay to Albato + Svix simultaneously
          curl -s -X POST https://h.albato.com/wh/38/1lf3rnr/O9whZJUQfZcWAqkAiodlBeMR9qkbL21l1yZSAYPqr78/ \
            -H "Content-Type: application/json" \
            -d '{"protocol":"dead-switch","action":"dump","run_id":"${{ github.run_id }}","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' || true
          
          curl -s -X POST https://play.svix.com/in/oAqq1httRtL8ZynkPc0Kdp4u1iH/ \
            -H "Content-Type: application/json" \
            -d '{"protocol":"dead-switch","action":"dump","run_id":"${{ github.run_id }}","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' || true
          
          echo "[DEAD SWITCH] Dump relayed to all vaults."
